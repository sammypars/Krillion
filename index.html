<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Krillion — the daily dive for rare answers</title>
  <meta name="description" content="Seven prompts a day. Obvious answers barely count; rare ones sink you deeper. How far down can you get?">
  <meta name="theme-color" content="#07111f">
  <meta property="og:title" content="Krillion">
  <meta property="og:description" content="Seven prompts a day. Rare answers sink you deeper.">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="preload" href="assets/fonts/vt323.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="retro.css">
</head>
<body>
  <div class="sea" aria-hidden="true">
    <div class="sea-layer sea-surface"></div>
    <div class="sea-layer sea-caustics"></div>
    <div class="sea-layer sea-rays"></div>
    <canvas id="fx"></canvas>
    <div class="sea-layer sea-vignette"></div>
  </div>

  <aside class="sounding" aria-hidden="true">
    <div class="sounding-track" id="soundingTrack"></div>
    <div class="sounding-marker" id="soundingMarker"><span id="soundingReadout">0 m</span></div>
  </aside>

  <header class="topbar">
    <button class="wordmark" id="homeBtn" aria-label="Krillion home">
      <svg viewBox="0 0 48 32" class="krill-glyph" aria-hidden="true"><path d="M4 18c6-10 22-14 34-8 3 1.5 5 4 6 6-3-1-6-1-9 0 2 2 2 5 1 7-2-3-5-4-8-4-8 0-16 1-24-1z" fill="currentColor"/><circle cx="36" cy="13" r="1.6" fill="#041526"/><path d="M14 22l-3 6M19 22l-2 7M24 22l-1 7M29 21l1 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M42 12c3-3 4-7 4-10M43 15c3-1 5-3 5-6" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg>
      <span>Krillion</span>
    </button>
    <nav class="topnav">
      <button class="icon-btn" data-open="history" aria-label="Your history" title="Your history">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v4h4M12 7v5l3 2" /></svg>
      </button>
      <button class="icon-btn" data-open="board" aria-label="Leaderboards" title="Leaderboards">
        <svg viewBox="0 0 24 24"><path d="M5 21V11M12 21V4M19 21v-7M3 21h18" /></svg>
      </button>
      <button class="icon-btn" data-open="help" aria-label="How to play" title="How to play">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.01" /></svg>
      </button>
      <button class="icon-btn" data-open="settings" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </nav>
  </header>

  <div class="cabinet">
    <div class="cab-bar"><span class="cab-label" id="cabLabel">DAILY</span><button class="cab-mute" id="muteBtn" type="button">MUTE</button></div>
    <main id="app" tabindex="-1"></main>
  </div>

  <dialog id="modal" aria-labelledby="modalTitle">
    <div class="modal-inner">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button class="icon-btn" data-close aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div id="modalBody"></div>
    </div>
  </dialog>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/prompts-a.js"></script>
  <script src="js/prompts-b.js"></script>
  <script src="js/prompts-c.js"></script>
  <script src="js/bank.js"></script>
  <script src="js/net.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/app.js"></script>
  <script src="js/modes.js"></script>
</body>
</html>
